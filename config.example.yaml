http_listen_addr: ":8081"

db:
  host: "localhost"
  port: 5432
  user: "rye"
  password: ""
  name: "orderbook"
  sslmode: "disable"

ssi:
  consumer_id: "" # SSI FastConnectData consumerID
  consumer_secret: "" # SSI FastConnectData consumerSecret
  public_key: ""
  private_key: ""
  base_url: "https://fc-data.ssi.com.vn" # REST API host
  stream_url: "" # IDS WebSocket host — set full URL + path per spec

telegram:
  bot_token: "" # from @BotFather — create a bot, copy the token here
  chat_id: 0 # your Telegram user ID — send /start to the bot, then read it from getUpdates

openai:
  api_key: "" # OpenAI API key from platform.openai.com
  model: "gpt-4o-mini" # model to use for signal interpretation

twitter:
  api_key: "" # OAuth 1.0a Consumer Key from developer.twitter.com
  api_key_secret: "" # OAuth 1.0a Consumer Secret
  access_token: "" # per-account access token (generate in the portal)
  access_token_secret: "" # per-account access token secret

cron:
  market_data: "30 3 * * *"  # 03:30 ICT — fetch previous-day market data
  ato_monitor: "0 9 * * *"   # 09:00 ICT — start ATO order book monitoring

signal:
  min_imbalance_ratio:
  max_spoof_fraction:
  min_bid_levels:
  ask_wall_fraction:
  ask_wall_price_range:
  stability_window:
  max_gap_from_ref:
  tp_ratio:
  bull_full_score:
  bull_half_score:
  choppy_full_score:
  choppy_half_score:
  bear_full_score:
  bear_half_score:

ato:
  timezone: "Asia/Ho_Chi_Minh"
  poll_interval: 2s
  end_hour: 9
  end_minute: 15
  drop_hour: 9
  drop_minute: 7
  signal_stop_hour: 9
  signal_stop_minute: 14
  ai_timeout: 30s
